name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.0

      - name: Validate tag and prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' internxt_webdav/config.yaml)"
          tag="${GITHUB_REF_NAME}"

          if [[ -z "${version}" || "${tag}" != "v${version}" ]]; then
            echo "::error::Tag ${tag} does not match app version ${version:-<missing>}."
            exit 1
          fi

          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' internxt_webdav/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::No changelog entry found for ${version}."
            exit 1
          fi

          {
            echo "## Installation"
            echo
            echo "Add this repository to the Home Assistant app store:"
            echo
            echo '```text'
            echo "https://github.com/${GITHUB_REPOSITORY}"
            echo '```'
            echo
            cat release-notes.md
          } > release-notes-with-installation.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "Internxt WebDAV ${GITHUB_REF_NAME#v}"
          --notes-file release-notes-with-installation.md
