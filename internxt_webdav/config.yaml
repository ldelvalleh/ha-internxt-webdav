# https://developers.home-assistant.io/docs/apps/configuration
name: "Internxt WebDAV"
version: "1.0.0"
slug: "internxt_webdav"
description: >-
  Back up Home Assistant to Internxt Drive — private, end-to-end encrypted cloud
  storage — through the official Internxt WebDAV server and the core WebDAV
  integration.
url: "https://github.com/ldelvalleh/ha-internxt-webdav"
arch:
  - amd64
  - aarch64
startup: services
init: false
ports:
  "3005/tcp": 3005
ports_description:
  "3005/tcp": >-
    Authenticated local Internxt WebDAV server. Never expose this port on the
    internet.
options:
  protocol: "https"
  webdav_username: "homeassistant"
schema:
  email: email
  password: password
  two_factor_code: "password?"
  otp_secret: "password?"
  webdav_username: str
  webdav_password: password
  protocol: "list(http|https)"
image: "ghcr.io/ldelvalleh/ha-internxt-webdav"
